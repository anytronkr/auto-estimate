<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니트론 견적서 생성</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        /* 견적폼과 같은 디자인 토큰 (틸그린 유지) */
        :root {
            --primary: #2A8486; --primary-strong: #216b6d; --primary-weak: #e8f4f4; --primary-weak-2: #d3eaea;
            --grey-100: #f2f4f6; --grey-200: #e5e8eb; --grey-500: #8b95a1; --grey-600: #6b7684; --grey-700: #4e5968; --grey-900: #191f28;
            --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font); background: var(--grey-100); color: var(--grey-900);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px 16px; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
        }
        .container { background: #fff; border-radius: 28px; padding: 48px 32px 36px; text-align: center; width: 100%; max-width: 440px; }
        .logo { width: 88px; height: 88px; border-radius: 26px; margin: 0 auto 24px; overflow: hidden; background: var(--grey-100); }
        .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .eyebrow { font-size: 14px; font-weight: 600; color: var(--primary); margin-bottom: 8px; }
        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.35; margin-bottom: 10px; }
        .subtitle { font-size: 15px; color: var(--grey-600); line-height: 1.6; margin-bottom: 32px; }
        .start-button {
            width: 100%; height: 58px; border: none; border-radius: 16px;
            background: var(--primary); color: #fff;
            font-family: inherit; font-size: 18px; font-weight: 700;
            cursor: pointer; transition: background 0.15s, transform 0.1s;
        }
        .start-button:hover { background: var(--primary-strong); }
        .start-button:active { transform: scale(0.98); }
        .start-button:disabled { background: var(--primary-weak-2); color: var(--primary-strong); cursor: not-allowed; transform: none; }
        .loading { display: none; margin-top: 20px; }
        .spinner { width: 28px; height: 28px; margin: 0 auto 10px; border: 3px solid var(--primary-weak-2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-message { font-size: 15px; font-weight: 600; color: var(--grey-700); min-height: 1.5em; transition: opacity 0.2s ease; }
        .loading-sub { font-size: 13px; color: var(--grey-500); margin-top: 4px; }
        .quick-links { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--grey-100); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .quick-link {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 14px 8px; border-radius: 14px; background: var(--grey-100);
            color: var(--grey-700); text-decoration: none; font-size: 13px; font-weight: 600;
            transition: background 0.15s;
        }
        .quick-link:hover { background: var(--grey-200); color: var(--grey-900); }
        .link-icon { font-size: 20px; }
        @media (max-width: 480px) {
            .container { padding: 40px 22px 28px; border-radius: 24px; }
            h1 { font-size: 23px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://yt3.googleusercontent.com/s7VsIPqvAChTQjSDxEphkx913wzI4BVTiS6ZOQPZbPpCClgrZQBb9YAS4yJFmfoMK2-vftRXfw=s160-c-k-c0x00ffffff-no-rj" alt="애니트론 로고">
        </div>
        <div class="eyebrow">바이텍테크놀로지 · 애니트론</div>
        <h1>견적서를 바로 만들어 드릴게요</h1>
        <p class="subtitle">거래처·제품을 입력하면 엑셀·PDF 견적서와<br>Pipedrive 기록까지 한 번에 끝나요.</p>
        <button id="startButton" class="start-button">
            견적서 작성 시작하기
        </button>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p id="loading-message" class="loading-message">준비 중...</p>
            <p id="loading-sub" class="loading-sub"></p>
        </div>

        <div class="quick-links">
            <a href="https://drive.google.com/drive/folders/1aRR0m61B_a4B6ag76GrYt-8bdxiyYRC6?ths=true" target="_blank" class="quick-link">
                <span class="link-icon">📁</span>
                견적서 드라이브
            </a>
            <a href="https://docs.google.com/spreadsheets/d/1lanDTaqOzAXFQaZcqj91X6kknbpHXREH3bLQrTeVq6Q/edit?gid=0#gid=0" target="_blank" class="quick-link">
                <span class="link-icon">📊</span>
                견적 발행목록
            </a>
        </div>
    </div>

    <script>
        // === 페이지 로드 시 백그라운드로 템플릿 미리 생성 ===
        let prefetchPromise = null;

        function prefetchTemplate() {
            console.log('[Pre-fetch] 백그라운드 템플릿 생성 시작');
            prefetchPromise = fetch('/create-estimate-template', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.json())
            .then(result => {
                console.log('[Pre-fetch] 완료:', result);
                return result;
            })
            .catch(err => {
                console.error('[Pre-fetch] 실패:', err);
                return null; // 실패해도 버튼 클릭 시 재시도
            });
        }

        // 페이지 로드 즉시 미리 생성 시작
        prefetchTemplate();

        // 단계별 로딩 메시지
        const loadingSteps = [
            { msg: '견적서 준비 중...', sub: '거의 다 됐어요', delay: 0 },
            { msg: '마무리 중...', sub: '조금만 기다려주세요', delay: 3000 },
        ];

        let stepTimers = [];

        function startLoadingMessages() {
            const msgEl = document.getElementById('loading-message');
            const subEl = document.getElementById('loading-sub');

            loadingSteps.forEach(step => {
                const timer = setTimeout(() => {
                    msgEl.style.opacity = '0';
                    setTimeout(() => {
                        msgEl.textContent = step.msg;
                        subEl.textContent = step.sub;
                        msgEl.style.opacity = '1';
                    }, 200);
                }, step.delay);
                stepTimers.push(timer);
            });
        }

        function stopLoadingMessages() {
            stepTimers.forEach(t => clearTimeout(t));
            stepTimers = [];
        }

        document.getElementById('startButton').addEventListener('click', async function() {
            const button = this;
            const loading = document.getElementById('loading');

            // 버튼 비활성화 및 로딩 표시
            button.disabled = true;
            button.textContent = '생성 중...';
            loading.style.display = 'block';
            startLoadingMessages();

            // 이전 견적 데이터 초기화 (localStorage + sessionStorage 모두)
            localStorage.removeItem('estimateData');
            localStorage.removeItem('productCategory');
            sessionStorage.removeItem('estimateData');
            sessionStorage.removeItem('productCategory');

            try {
                // 미리 생성한 결과가 있으면 사용, 없으면 새로 호출
                let result = prefetchPromise ? await prefetchPromise : null;

                // pre-fetch 실패했거나 없으면 새로 호출
                if (!result || result.status !== 'success') {
                    console.log('Pre-fetch 결과 없음 → 새로 API 호출');
                    const response = await fetch('/create-estimate-template', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    result = await response.json();
                }

                console.log('API 응답 결과:', result);

                if (result.status === 'success') {
                    stopLoadingMessages();
                    document.getElementById('loading-message').textContent = '완료! 견적서 폼으로 이동합니다';
                    document.getElementById('loading-sub').textContent = '';

                    setTimeout(() => {
                        window.location.href = `/estimate_form.html?id=${result.file_id}`;
                    }, 300);
                } else {
                    stopLoadingMessages();
                    alert('견적서 템플릿 생성에 실패했습니다: ' + result.message);
                    button.disabled = false;
                    button.textContent = '견적서 작성 시작하기';
                    loading.style.display = 'none';
                }

            } catch (error) {
                stopLoadingMessages();
                console.error('견적서 템플릿 생성 중 오류:', error);
                alert('견적서 템플릿 생성 중 오류가 발생했습니다.');
                button.disabled = false;
                button.textContent = '견적서 작성 시작하기';
                loading.style.display = 'none';
            }
        });

        // 서버 활성 상태 유지 (10분마다 ping)
        function keepAlive() {
            fetch('/ping')
                .then(response => response.json())
                .then(data => {
                    console.log('Keep-alive ping:', data.pong);
                })
                .catch(error => {
                    console.error('Keep-alive failed:', error);
                });
        }

        // 페이지 로드 시 즉시 실행
        keepAlive();

        // 주기적으로 실행 (10분마다)
        setInterval(keepAlive, 10 * 60 * 1000);
    </script>
</body>
</html>
