<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>견적서 미리보기</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
background: #fff;
font-family: 'Pretendard', 'Noto Sans KR', Arial, sans-serif;
margin: 0;
}
.container {
max-width: 900px;
margin: 32px auto;
background: #fff;
padding: 32px 40px 24px 40px;
border: 1px solid #e0e0e0;
border-radius: 8px;
box-shadow: none;
}
.header-bar {
background: #21808c;
color: #fff;
padding: 24px 32px;
display: flex;
justify-content: space-between;
align-items: center;
border-radius: 8px 8px 0 0;
}
h2 {
color: #21808c;
font-size: 2.2em;
margin: 32px 0 16px 0;
font-weight: 800;
letter-spacing: -1px;
}
.section-title {
color: #21808c;
font-weight: bold;
font-size: 1.1em;
border-left: 4px solid #21808c;
padding-left: 10px;
margin: 32px 0 12px 0;
background: none;
}
hr {
border: none;
border-top: 1.5px solid #e0e0e0;
margin: 24px 0;
}
.row-flex {
display: flex;
align-items: center;
margin-bottom: 8px;
}
.row-flex label {
min-width: 90px;
color: #21808c;
font-weight: 600;
margin-right: 8px;
}
.value-box {
flex: 1;
background: #f7f7f7;
border: 1px solid #e0e0e0;
border-radius: 4px;
padding: 7px 12px;
font-size: 1em;
color: #222;
}
.product-table-wrap {
overflow-x: auto;
margin-bottom: 16px;
}
.product-table {
width: 100%;
border-collapse: collapse;
background: #fff;
font-size: 1em;
text-align: center;
}
.product-table th {
background: #21808c;
color: #fff !important;
font-weight: 700;
padding: 8px 0;
border: 1px solid #e0e0e0;
}
.product-table td {
border: 1px solid #e0e0e0;
padding: 8px 0;
color: #222;
}
.final-total {
background: #21808c;
color: #fff;
font-weight: bold;
font-size: 1.1em;
}
button {
border: none;
border-radius: 6px;
padding: 12px 24px;
font-size: 1em;
margin: 0 8px;
background: #21808c;
color: #fff;
cursor: pointer;
transition: all 0.3s ease;
}

/* 로딩 애니메이션 스타일 */
.loading {
  position: relative;
  background: #1cc7b6 !important;
  color: transparent !important;
  pointer-events: none;
  transform: scale(0.98);
  box-shadow: 0 2px 8px rgba(28, 199, 182, 0.3);
  transition: all 0.3s ease;
}

.loading::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 24px;
  height: 24px;
  margin: -12px 0 0 -12px;
  border: 3px solid rgba(255, 255, 255, 0.2);
  border-top: 3px solid #fff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  z-index: 10;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* 버튼 비활성화 상태 */
button:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}
button#back-to-edit {
background: #e0e0e0;
color: #21808c;
}
button:hover:not(:disabled) {
opacity: 0.9;
transform: translateY(-1px);
box-shadow: 0 4px 12px rgba(33, 128, 140, 0.3);
}

button:active:not(:disabled) {
transform: translateY(0);
box-shadow: 0 2px 6px rgba(33, 128, 140, 0.3);
}
.header-bar h2 {
color: #fff !important;
margin: 0;
font-size: 2.2em;
font-weight: 800;
letter-spacing: -1px;
}

    /* ===== 진행 화면 (견적서 생성 / PDF 생성 대기) ===== */
    .ep-overlay { position: fixed; inset: 0; background: rgba(15, 40, 41, 0.55); display: flex; align-items: center; justify-content: center; z-index: 9999; animation: ep-fade 0.2s ease; padding: 16px; box-sizing: border-box; }
    @keyframes ep-fade { from { opacity: 0; } to { opacity: 1; } }
    .ep-card { background: #fff; border-radius: 16px; width: 100%; max-width: 420px; padding: 28px 28px 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25); box-sizing: border-box; font-family: 'Pretendard', 'Noto Sans KR', Arial, sans-serif; }
    .ep-title { font-size: 18px; font-weight: 700; color: #1f3d3e; margin: 0 0 4px; }
    .ep-sub { font-size: 13px; color: #7a8a8b; margin: 0 0 18px; }
    .ep-bar { height: 6px; background: #e6f0f0; border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
    .ep-bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2A8486, #3fb6b2); border-radius: 3px; transition: width 0.5s ease; }
    .ep-steps { list-style: none; margin: 0; padding: 0; }
    .ep-steps li { display: flex; align-items: center; gap: 12px; padding: 7px 0; font-size: 14px; color: #a3b1b2; transition: color 0.2s ease; }
    .ep-ic { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #d5e1e1; flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; box-sizing: border-box; }
    .ep-steps li.active { color: #1f3d3e; font-weight: 600; }
    .ep-steps li.active .ep-ic { border-color: #cfe6e6; border-top-color: #2A8486; animation: ep-spin 0.8s linear infinite; }
    .ep-steps li.done { color: #2A8486; }
    .ep-steps li.done .ep-ic { background: #2A8486; border-color: #2A8486; }
    .ep-steps li.done .ep-ic::after { content: '✓'; }
    .ep-steps li.error { color: #c0392b; font-weight: 600; }
    .ep-steps li.error .ep-ic { background: #e74c3c; border-color: #e74c3c; }
    .ep-steps li.error .ep-ic::after { content: '!'; }
    .ep-note { display: none; margin-top: 14px; padding: 10px 12px; background: #fff8e5; border: 1px solid #f3dd9b; border-radius: 8px; font-size: 13px; line-height: 1.5; color: #6b5200; }
    .ep-note.show { display: block; }
    .ep-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; font-size: 12px; color: #9aa8a9; }
    @keyframes ep-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .ep-steps li.active .ep-ic { animation: none; border-color: #2A8486; }
      .ep-bar > i { transition: none; } .ep-overlay { animation: none; }
    }
  </style>
</head>
<body>
<div class="container">
<div class="header-bar">
<h2>견적서 미리보기</h2>
</div>

</div>

<div class="row-flex">

</div>
<div class="row-flex">

<div class="value-box" id="supplier-phone"></div>
</div>
<div class="section-title">수신자</div>
<div class="row-flex">
<label>회사명</label>
<div class="value-box" id="receiver-company"></div>
</div>
<div class="row-flex">
<label>담당자</label>
<div class="value-box" id="receiver-person"></div>
</div>
<div class="row-flex">
<label>이메일</label>
<div class="value-box" id="receiver-email"></div>
</div>
<div class="row-flex">
<label>전화번호</label>
<div class="value-box" id="receiver-phone"></div>
</div>

<table class="product-table" id="product-table">
<thead>
<tr>
<th>구분</th><th>제품명</th><th>제품상세정보</th><th>수량</th><th>공급단가(원)</th><th>합계(원)</th><th>비고</th>
</tr>
</thead>
<tbody>

</tbody>
</table>
</div>

<div class="row-flex">
<label>납기일</label>
<div class="value-box" id="delivery-date"></div>

<div class="value-box" id="final-total"></div>
</div>
</div>
<div style="display: flex; justify-content: center; gap: 16px; margin-top: 32px;">
<button id="back-to-edit" style="padding: 12px 24px; border-radius: 8px; border: none; background: #eee; color: #222; font-size: 1em; cursor: pointer;">편집으로 돌아가기</button>
<button id="download-pdf" style="padding: 12px 24px; border-radius: 8px; border: none; background: #1cc7b6; color: #fff; font-size: 1em; cursor: pointer;">PDF파일 생성하기</button>
</div>
<script>
// localStorage에서 데이터 읽기
const estimateData = localStorage.getItem('estimateData');
console.log('localStorage에서 읽은 데이터:', estimateData);

if (!estimateData) {
  alert('데이터가 없습니다.');
} else {
  try {
    // JSON 파싱
    const data = JSON.parse(estimateData);
    console.log('파싱된 데이터:', data);
    
    // 각 필드에 대해 안전하게 바인딩
    document.getElementById('estimate-date').textContent = data.estimate_date || '';
    document.getElementById('estimate-number').textContent = data.estimate_number || '';
    document.getElementById('supplier-company').textContent = "(주)바이텍테크놀로지";
    document.getElementById('supplier-person').textContent = (data.supplier_person || '').replace('하철웅', '하철용');
    document.getElementById('supplier-email').textContent = data.supplier_email || '';
    document.getElementById('supplier-phone').textContent = data.supplier_phone || '';
    document.getElementById('receiver-company').textContent = data.receiver_company || '';
    document.getElementById('receiver-person').textContent = data.receiver_person || '';
    document.getElementById('receiver-email').textContent = data.receiver_email || '';
    document.getElementById('receiver-phone').textContent = data.receiver_phone || '';
    document.getElementById('delivery-date').textContent = data.delivery_date || '';
    document.getElementById('product-training').textContent = data.product_training || '';
    
    // 제품정보 테이블 생성
    const tbody = document.getElementById('product-table').querySelector('tbody');
    tbody.innerHTML = '';
    
    if (data.products && Array.isArray(data.products)) {
      data.products.forEach(product => {
        if (product && product.type) {
          const tds = [
            `<td>${product.type || ''}</td>`,
            `<td>${product.name || ''}</td>`,
            `<td>${product.detail || ''}</td>`,
            `<td>${product.qty || ''}</td>`,
            `<td>${Number(product.price || 0).toLocaleString()}</td>`,
            `<td>${Number(product.total || 0).toLocaleString()}</td>`,
            `<td>${product.note || ''}</td>`
          ];
          tbody.innerHTML += `<tr>${tds.join('')}</tr>`;
        }
      });
    }
    
    // 합계 계산
    const total = (data.products || []).reduce((sum, p) => {
      const price = Number(p.price || 0);
      const qty = Number(p.qty || 0);
      return sum + (price * qty);
    }, 0);
    const vat = Math.round(total * 0.1);
    const finalTotal = total + vat;

    document.getElementById('sum-total').textContent = total.toLocaleString();
    document.getElementById('vat').textContent = vat.toLocaleString();
    document.getElementById('final-total').textContent = finalTotal.toLocaleString();
    
  } catch (e) {
    console.error('데이터 파싱 오류:', e);
    alert('데이터 파싱 오류가 발생했습니다. 다시 시도해 주세요.');
  }
}

// ===== 진행 화면 (견적서 생성 / PDF 생성 대기) =====
// showProgress(제목, [단계...]) → { step(i), stepLater(i, ms), complete(), note(text), fail(), leave(), close() }
function showProgress(title, steps) {
  document.querySelectorAll('.ep-overlay').forEach(function(x) { x.remove(); });
  const el = document.createElement('div');
  el.className = 'ep-overlay';
  el.setAttribute('role', 'alertdialog');
  el.setAttribute('aria-live', 'polite');
  el.innerHTML = '<div class="ep-card"><p class="ep-title"></p>' +
    '<p class="ep-sub">창을 닫거나 새로고침하지 마세요.</p>' +
    '<div class="ep-bar"><i></i></div><ul class="ep-steps"></ul>' +
    '<div class="ep-note"></div>' +
    '<div class="ep-foot"><span>진행 단계는 서버 작업에 맞춰 표시됩니다</span><span class="ep-time">0초</span></div></div>';
  el.querySelector('.ep-title').textContent = title;
  const ul = el.querySelector('.ep-steps');
  steps.forEach(function(s) {
    const li = document.createElement('li');
    const ic = document.createElement('span'); ic.className = 'ep-ic';
    const tx = document.createElement('span'); tx.textContent = s;
    li.appendChild(ic); li.appendChild(tx); ul.appendChild(li);
  });
  document.body.appendChild(el);

  const items = Array.from(ul.children);
  const bar = el.querySelector('.ep-bar > i');
  const timeEl = el.querySelector('.ep-time');
  const t0 = Date.now();
  const tick = setInterval(function() { timeEl.textContent = Math.floor((Date.now() - t0) / 1000) + '초'; }, 500);
  const timers = [];
  const guard = function(e) { e.preventDefault(); e.returnValue = ''; };
  window.addEventListener('beforeunload', guard);
  let cur = -1;

  function paint() {
    items.forEach(function(li, i) { li.className = i < cur ? 'done' : (i === cur ? 'active' : ''); });
    // 진행 중인 단계는 절반만큼 채워서 멈춘 것처럼 보이지 않게
    const filled = Math.min(cur, items.length) + (cur < items.length ? 0.5 : 0);
    bar.style.width = Math.round(Math.max(0, filled) / items.length * 100) + '%';
  }
  function stopTimers() { timers.forEach(clearTimeout); timers.length = 0; }

  return {
    step: function(i) { if (i > cur) { cur = Math.min(i, items.length - 1); paint(); } },
    // 서버 응답 하나로 여러 단계가 끝나는 경우: 예상 시간에 맞춰 앞 단계만 넘기고 마지막 단계는 응답을 기다림
    stepLater: function(i, ms) { const self = this; timers.push(setTimeout(function() { self.step(i); }, ms)); },
    complete: function() { stopTimers(); cur = items.length; paint(); },
    note: function(text) { const n = el.querySelector('.ep-note'); n.textContent = text; n.classList.add('show'); },
    fail: function() { stopTimers(); if (items[cur]) items[cur].className = 'error'; },
    leave: function() { stopTimers(); window.removeEventListener('beforeunload', guard); },
    close: function() { stopTimers(); clearInterval(tick); window.removeEventListener('beforeunload', guard); el.remove(); }
  };
}

// 뒤로가기로 돌아왔을 때(bfcache) 남아 있는 진행 화면 정리
window.addEventListener('pageshow', function(e) {
  if (e.persisted) document.querySelectorAll('.ep-overlay').forEach(function(x) { x.remove(); });
});

// PDF 생성 함수 추가
async function generatePDF() {
  const button = document.getElementById('download-pdf');
  if (button.disabled) return; // 이미 처리 중이면 무시 (중복 클릭 방지)
  const originalText = button.textContent;
  let navigating = false;
  const progress = showProgress('PDF 견적서를 만들고 있어요', [
    'PDF 변환',
    '구글 드라이브 저장',
    'Pipedrive 거래에 첨부',
    '견적서 발행목록 기록'
  ]);

  try {
    button.disabled = true;
    button.textContent = '처리 중...';
    progress.step(0);

    console.log('=== PDF 생성 및 전체 프로세스 시작 ===');

    const estimateData = localStorage.getItem('estimateData');
    if (!estimateData) {
      alert('견적 데이터가 없습니다.');
      return;
    }
    const data = JSON.parse(estimateData);

    const urlParams = new URLSearchParams(window.location.search);
    console.log('preview.html - URL 파라미터:', urlParams.toString());
    console.log('preview.html - URL에서 가져온 id:', urlParams.get('id'));
    console.log('preview.html - localStorage data.fileId:', data.fileId);
    
    const fileId = urlParams.get('id') || data.fileId;
    console.log('preview.html - 최종 사용할 fileId:', fileId);
    
    if (fileId) {
      data.fileId = fileId;
      console.log('preview.html - data.fileId 설정 완료:', data.fileId);
    } else {
      console.error('preview.html - fileId가 없습니다!');
      alert("fileId가 없습니다. URL에 id 파라미터가 필요합니다.");
      return;
    }

    // 견적제품 선택 데이터 추가 (estimate_form.html에서 전달받은 데이터)
    const productCategory = localStorage.getItem('productCategory') || '';
    data.product_category = productCategory;
    
    console.log('전송할 데이터:', data);

    // 서버 요청 하나로 4단계가 모두 처리됨 → 예상 시간에 맞춰 표시, 마지막 단계는 응답을 기다림
    // (예상 시간은 Render 로그의 [TIMING] 기록을 보고 조정)
    progress.stepLater(1, 4000);
    progress.stepLater(2, 7000);
    progress.stepLater(3, 11000);

    const response = await fetch('https://auto-estimate.onrender.com/collect-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    console.log('서버 응답 상태:', response.status, response.statusText);
    
    if (!response.ok) {
      const errorText = await response.text();
      console.error('서버 오류 응답:', errorText);
      throw new Error(`서버 오류: ${response.status} - ${errorText}`);
    }

    const result = await response.json();
    console.log('서버 응답:', result);

    if (result.status === 'success') {
      progress.complete();
      let holdMs = 300;
      if (result.already_issued) {
        progress.note('이미 발행된 견적이라 다시 만들지 않았습니다. 기존 PDF로 이동합니다.');
        holdMs = 2000;
      }
      navigating = true;

      setTimeout(() => {
        progress.leave();
        // PDF 링크가 있으면 PDF 공유화면으로 이동 (원본 fileId도 함께 전달)
        if (result.pdf_link) {
          const match = result.pdf_link.match(/\/d\/([\w-]+)/);
          const pdfId = match?.[1] || '';
          const originalFileId = data.fileId; // 원본 견적서 fileId
          window.location.href = `pdf-sharing.html?id=${pdfId}&fileId=${originalFileId}`;
        } else {
          // PDF 링크가 없어도 성공 메시지 표시 후 홈으로 이동
          alert('견적 데이터가 성공적으로 처리되었습니다!\n' + result.message);
          localStorage.removeItem('estimateData');
          localStorage.removeItem('productCategory');
          window.location.href = 'index.html';
        }
      }, holdMs);
    } else {
      progress.fail();
      alert('PDF를 만들지 못했습니다.\n\n' + (result.message || '알 수 없는 오류'));
    }
  } catch (e) {
    console.error('PDF 생성 중 오류:', e);
    progress.fail();
    const what = String(e && e.message || '').startsWith('서버 오류')
      ? 'PDF를 만드는 중 서버에서 오류가 났습니다.'
      : 'PDF를 만드는 중 서버와 연결이 끊겼습니다.';
    alert(what + '\n\n' +
      '이미 처리됐을 수 있으니, 다시 누르기 전에 발행목록이나 Pipedrive 거래를 먼저 확인해 주세요.\n' +
      '(처리가 끝난 견적은 다시 눌러도 두 번 기록되지 않습니다.)');
  } finally {
    // PDF 화면으로 넘어가는 중에는 버튼을 다시 열지 않음 (중복 발행 방지)
    if (!navigating) {
      progress.close();
      button.disabled = false;
      button.textContent = originalText;
    }
  }
}

// PDF 화면에서 뒤로가기로 돌아오면 버튼 다시 사용 가능하게
window.addEventListener('pageshow', function(e) {
  if (!e.persisted) return;
  const btn = document.getElementById('download-pdf');
  if (btn && btn.disabled) {
    btn.disabled = false;
    btn.textContent = 'PDF파일 생성하기';
  }
});

document.getElementById('back-to-edit').onclick = function() {
history.back();
};

// PDF 생성 버튼에 이벤트 리스너 추가
document.getElementById('download-pdf').onclick = generatePDF;
</script>
</body>
