<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>견적서 미리보기</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 견적폼과 같은 디자인 토큰 (틸그린 유지, 밝은 회색 배경 + 흰 카드) */
:root {
  --primary: #2A8486; --primary-strong: #216b6d; --primary-weak: #e8f4f4;
  --grey-50: #f9fafb; --grey-100: #f2f4f6; --grey-200: #e5e8eb; --grey-300: #d1d6db;
  --grey-400: #b0b8c1; --grey-500: #8b95a1; --grey-600: #6b7684; --grey-700: #4e5968;
  --grey-800: #333d4b; --grey-900: #191f28;
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); background: var(--grey-100); color: var(--grey-900); -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }

.topbar { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.92); backdrop-filter: saturate(180%) blur(12px); -webkit-backdrop-filter: saturate(180%) blur(12px); border-bottom: 1px solid var(--grey-200); }
.topbar-inner { max-width: 820px; margin: 0 auto; height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
.brand-mark { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.brand-sub { font-weight: 500; color: var(--grey-500); }

.container { max-width: 820px; margin: 0 auto; padding: 0 16px 24px; }
.page-head { padding: 32px 4px 20px; }
.page-head h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
.page-head p { margin: 6px 0 0; font-size: 15px; color: var(--grey-600); }

.card { background: #fff; border-radius: 20px; padding: 24px 28px; margin-bottom: 12px; }
.section-title { font-size: 17px; font-weight: 700; color: var(--grey-900); margin: 0 0 8px; }

.row-flex { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--grey-100); }
.row-flex:last-child { border-bottom: none; }
.row-flex label { flex: none; width: 110px; font-size: 14px; font-weight: 500; color: var(--grey-600); }
.value-box { flex: 1; text-align: right; font-size: 15px; font-weight: 600; color: var(--grey-900); word-break: keep-all; overflow-wrap: anywhere; min-height: 1.4em; }
.value-box:empty::after { content: '-'; color: var(--grey-400); font-weight: 500; }

.product-table-wrap { overflow-x: auto; margin: 8px -4px 0; }
.product-table { width: 100%; min-width: 640px; border-collapse: separate; border-spacing: 0; font-size: 14px; }
.product-table th { background: var(--grey-50); color: var(--grey-600); font-weight: 600; font-size: 13px; padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--grey-200); white-space: nowrap; }
.product-table th:first-child { border-radius: 10px 0 0 10px; }
.product-table th:last-child { border-radius: 0 10px 10px 0; }
.product-table td { padding: 14px 8px; color: var(--grey-800); border-bottom: 1px solid var(--grey-100); vertical-align: top; text-align: left; white-space: pre-line; }
.product-table td:nth-child(4), .product-table td:nth-child(5), .product-table td:nth-child(6),
.product-table th:nth-child(4), .product-table th:nth-child(5), .product-table th:nth-child(6) { text-align: right; white-space: nowrap; }
.product-table td:nth-child(2) { font-weight: 600; color: var(--grey-900); }
.product-table td:nth-child(3) { color: var(--grey-600); font-size: 13px; min-width: 180px; }
.product-table tbody tr:last-child td { border-bottom: none; }

.total-card { background: var(--grey-900); color: #fff; }
.total-card .section-title { color: rgba(255,255,255,0.75); font-size: 15px; font-weight: 600; }
.total-card .row-flex { border-bottom-color: rgba(255,255,255,0.08); }
.total-card .row-flex label { color: rgba(255,255,255,0.6); }
.total-card .value-box { color: #fff; }
.total-card .row-flex.grand label { color: #fff; font-weight: 600; padding-top: 6px; }
.total-card .row-flex.grand .value-box { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.total-card .row-flex.grand .value-box::after { content: ' 원'; font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.7); }

.cta-bar { position: sticky; bottom: 0; z-index: 40; display: flex; gap: 8px; max-width: 820px; margin: 0 auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(to bottom, rgba(242,244,246,0), var(--grey-100) 28%); }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 56px; padding: 0 22px; border: none; border-radius: 14px; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer; transition: background 0.15s, transform 0.1s; }
.btn:active { transform: scale(0.98); }
.btn-primary { flex: 1; background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-strong); }
.btn-secondary { background: #fff; color: var(--grey-700); }
.btn-secondary:hover { background: var(--grey-200); }
button:disabled { opacity: 0.6; cursor: not-allowed; }

@media (max-width: 720px) {
  .page-head { padding: 24px 4px 16px; }
  .page-head h1 { font-size: 24px; }
  .card { padding: 20px 18px; border-radius: 18px; }
  .row-flex label { width: 92px; }
}
/* ===== 진행 화면 (견적서 생성 / PDF 생성 대기) ===== */
    .ep-overlay { position: fixed; inset: 0; background: rgba(25, 31, 40, 0.5); display: flex; align-items: center; justify-content: center; z-index: 9999; animation: ep-fade 0.2s ease; padding: 16px; box-sizing: border-box; }
    @keyframes ep-fade { from { opacity: 0; } to { opacity: 1; } }
    .ep-card { background: #fff; border-radius: 24px; width: 100%; max-width: 400px; padding: 28px 28px 22px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2); box-sizing: border-box; font-family: var(--font); }
    .ep-title { font-size: 20px; font-weight: 700; color: var(--grey-900); letter-spacing: -0.02em; margin: 0 0 4px; }
    .ep-sub { font-size: 13px; color: #7a8a8b; margin: 0 0 18px; }
    .ep-bar { height: 6px; background: #e6f0f0; border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
    .ep-bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2A8486, #3fb6b2); border-radius: 3px; transition: width 0.5s ease; }
    .ep-steps { list-style: none; margin: 0; padding: 0; }
    .ep-steps li { display: flex; align-items: center; gap: 12px; padding: 7px 0; font-size: 14px; color: #a3b1b2; transition: color 0.2s ease; }
    .ep-ic { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #d5e1e1; flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; box-sizing: border-box; }
    .ep-steps li.active { color: #1f3d3e; font-weight: 600; }
    .ep-steps li.active .ep-ic { border-color: #cfe6e6; border-top-color: #2A8486; animation: ep-spin 0.8s linear infinite; }
    .ep-steps li.done { color: #2A8486; }
    .ep-steps li.done .ep-ic { background: #2A8486; border-color: #2A8486; }
    .ep-steps li.done .ep-ic::after { content: '✓'; }
    .ep-steps li.error { color: #c0392b; font-weight: 600; }
    .ep-steps li.error .ep-ic { background: #e74c3c; border-color: #e74c3c; }
    .ep-steps li.error .ep-ic::after { content: '!'; }
    .ep-note { display: none; margin-top: 14px; padding: 10px 12px; background: #fff8e5; border: 1px solid #f3dd9b; border-radius: 8px; font-size: 13px; line-height: 1.5; color: #6b5200; }
    .ep-note.show { display: block; }
    .ep-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; font-size: 12px; color: #9aa8a9; }
    @keyframes ep-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .ep-steps li.active .ep-ic { animation: none; border-color: #2A8486; }
      .ep-bar > i { transition: none; } .ep-overlay { animation: none; }
    }
  </style>
</head>
<body>
<div class="topbar"><div class="topbar-inner"><span class="brand-mark"></span>바이텍테크놀로지 <span class="brand-sub">자동견적</span></div></div>
<div class="container">
  <div class="page-head">
    <h1>견적서 미리보기</h1>
    <p>내용을 확인한 뒤 PDF 파일을 만들어 주세요. 고칠 곳이 있으면 '수정하기'를 눌러요.</p>
  </div>

  <div class="card">
    <div class="section-title">기본정보</div>
    <div class="row-flex"><label>견적일자</label><div class="value-box" id="estimate-date"></div></div>
    <div class="row-flex"><label>견적번호</label><div class="value-box" id="estimate-number"></div></div>
  </div>

  <div class="card">
    <div class="section-title">공급자</div>
    <div class="row-flex"><label>회사명</label><div class="value-box" id="supplier-company"></div></div>
    <div class="row-flex"><label>담당자</label><div class="value-box" id="supplier-person"></div></div>
    <div class="row-flex"><label>이메일</label><div class="value-box" id="supplier-email"></div></div>
    <div class="row-flex"><label>전화번호</label><div class="value-box" id="supplier-phone"></div></div>
  </div>

  <div class="card">
    <div class="section-title">수신자</div>
    <div class="row-flex"><label>회사명</label><div class="value-box" id="receiver-company"></div></div>
    <div class="row-flex"><label>담당자</label><div class="value-box" id="receiver-person"></div></div>
    <div class="row-flex"><label>이메일</label><div class="value-box" id="receiver-email"></div></div>
    <div class="row-flex"><label>전화번호</label><div class="value-box" id="receiver-phone"></div></div>
  </div>

  <div class="card">
    <div class="section-title">제품정보</div>
    <div class="product-table-wrap">
      <table class="product-table" id="product-table">
        <thead>
          <tr><th>구분</th><th>제품명</th><th>제품상세정보</th><th>수량</th><th>공급단가(원)</th><th>합계(원)</th><th>비고</th></tr>
        </thead>
        <tbody>
          <!-- JS로 제품정보 행 추가 -->
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="section-title">기타</div>
    <div class="row-flex"><label>납기일</label><div class="value-box" id="delivery-date"></div></div>
    <div class="row-flex"><label>제품교육</label><div class="value-box" id="product-training"></div></div>
  </div>

  <div class="card total-card">
    <div class="section-title">견적 금액</div>
    <div class="row-flex"><label>합계</label><div class="value-box" id="sum-total"></div></div>
    <div class="row-flex"><label>부가세(VAT)</label><div class="value-box" id="vat"></div></div>
    <div class="row-flex grand"><label>최종견적<br>(VAT 포함)</label><div class="value-box" id="final-total"></div></div>
  </div>
</div>

<div class="cta-bar">
  <button id="back-to-edit" class="btn btn-secondary">수정하기</button>
  <button id="download-pdf" class="btn btn-primary">PDF 파일 만들기</button>
</div>
<script>
// localStorage에서 데이터 읽기
const estimateData = localStorage.getItem('estimateData');
console.log('localStorage에서 읽은 데이터:', estimateData);

if (!estimateData) {
  alert('데이터가 없습니다.');
} else {
  try {
    // JSON 파싱
    const data = JSON.parse(estimateData);
    console.log('파싱된 데이터:', data);
    
    // 각 필드에 대해 안전하게 바인딩
    document.getElementById('estimate-date').textContent = data.estimate_date || '';
    document.getElementById('estimate-number').textContent = data.estimate_number || '';
    document.getElementById('supplier-company').textContent = "(주)바이텍테크놀로지";
    document.getElementById('supplier-person').textContent = (data.supplier_person || '').replace('하철웅', '하철용');
    document.getElementById('supplier-email').textContent = data.supplier_email || '';
    document.getElementById('supplier-phone').textContent = data.supplier_phone || '';
    document.getElementById('receiver-company').textContent = data.receiver_company || '';
    document.getElementById('receiver-person').textContent = data.receiver_person || '';
    document.getElementById('receiver-email').textContent = data.receiver_email || '';
    document.getElementById('receiver-phone').textContent = data.receiver_phone || '';
    document.getElementById('delivery-date').textContent = data.delivery_date || '';
    document.getElementById('product-training').textContent = data.product_training || '';
    
    // 제품정보 테이블 생성
    const tbody = document.getElementById('product-table').querySelector('tbody');
    tbody.innerHTML = '';
    
    if (data.products && Array.isArray(data.products)) {
      data.products.forEach(product => {
        if (product && product.type) {
          const tds = [
            `<td>${product.type || ''}</td>`,
            `<td>${product.name || ''}</td>`,
            `<td>${product.detail || ''}</td>`,
            `<td>${product.qty || ''}</td>`,
            `<td>${Number(product.price || 0).toLocaleString()}</td>`,
            `<td>${Number(product.total || 0).toLocaleString()}</td>`,
            `<td>${product.note || ''}</td>`
          ];
          tbody.innerHTML += `<tr>${tds.join('')}</tr>`;
        }
      });
    }
    
    // 합계 계산
    const total = (data.products || []).reduce((sum, p) => {
      const price = Number(p.price || 0);
      const qty = Number(p.qty || 0);
      return sum + (price * qty);
    }, 0);
    const vat = Math.round(total * 0.1);
    const finalTotal = total + vat;

    document.getElementById('sum-total').textContent = total.toLocaleString();
    document.getElementById('vat').textContent = vat.toLocaleString();
    document.getElementById('final-total').textContent = finalTotal.toLocaleString();
    
  } catch (e) {
    console.error('데이터 파싱 오류:', e);
    alert('데이터 파싱 오류가 발생했습니다. 다시 시도해 주세요.');
  }
}

// ===== 진행 화면 (견적서 생성 / PDF 생성 대기) =====
// showProgress(제목, [단계...]) → { step(i), stepLater(i, ms), complete(), note(text), fail(), leave(), close() }
function showProgress(title, steps) {
  document.querySelectorAll('.ep-overlay').forEach(function(x) { x.remove(); });
  const el = document.createElement('div');
  el.className = 'ep-overlay';
  el.setAttribute('role', 'alertdialog');
  el.setAttribute('aria-live', 'polite');
  el.innerHTML = '<div class="ep-card"><p class="ep-title"></p>' +
    '<p class="ep-sub">창을 닫거나 새로고침하지 마세요.</p>' +
    '<div class="ep-bar"><i></i></div><ul class="ep-steps"></ul>' +
    '<div class="ep-note"></div>' +
    '<div class="ep-foot"><span>진행 단계는 서버 작업에 맞춰 표시됩니다</span><span class="ep-time">0초</span></div></div>';
  el.querySelector('.ep-title').textContent = title;
  const ul = el.querySelector('.ep-steps');
  steps.forEach(function(s) {
    const li = document.createElement('li');
    const ic = document.createElement('span'); ic.className = 'ep-ic';
    const tx = document.createElement('span'); tx.textContent = s;
    li.appendChild(ic); li.appendChild(tx); ul.appendChild(li);
  });
  document.body.appendChild(el);

  const items = Array.from(ul.children);
  const bar = el.querySelector('.ep-bar > i');
  const timeEl = el.querySelector('.ep-time');
  const t0 = Date.now();
  const tick = setInterval(function() { timeEl.textContent = Math.floor((Date.now() - t0) / 1000) + '초'; }, 500);
  const timers = [];
  const guard = function(e) { e.preventDefault(); e.returnValue = ''; };
  window.addEventListener('beforeunload', guard);
  let cur = -1;

  function paint() {
    items.forEach(function(li, i) { li.className = i < cur ? 'done' : (i === cur ? 'active' : ''); });
    // 진행 중인 단계는 절반만큼 채워서 멈춘 것처럼 보이지 않게
    const filled = Math.min(cur, items.length) + (cur < items.length ? 0.5 : 0);
    bar.style.width = Math.round(Math.max(0, filled) / items.length * 100) + '%';
  }
  function stopTimers() { timers.forEach(clearTimeout); timers.length = 0; }

  return {
    step: function(i) { if (i > cur) { cur = Math.min(i, items.length - 1); paint(); } },
    // 서버 응답 하나로 여러 단계가 끝나는 경우: 예상 시간에 맞춰 앞 단계만 넘기고 마지막 단계는 응답을 기다림
    stepLater: function(i, ms) { const self = this; timers.push(setTimeout(function() { self.step(i); }, ms)); },
    complete: function() { stopTimers(); cur = items.length; paint(); },
    note: function(text) { const n = el.querySelector('.ep-note'); n.textContent = text; n.classList.add('show'); },
    fail: function() { stopTimers(); if (items[cur]) items[cur].className = 'error'; },
    leave: function() { stopTimers(); window.removeEventListener('beforeunload', guard); },
    close: function() { stopTimers(); clearInterval(tick); window.removeEventListener('beforeunload', guard); el.remove(); }
  };
}

// 뒤로가기로 돌아왔을 때(bfcache) 남아 있는 진행 화면 정리
window.addEventListener('pageshow', function(e) {
  if (e.persisted) document.querySelectorAll('.ep-overlay').forEach(function(x) { x.remove(); });
});

// 미리보기가 열리면 서버가 PDF 변환을 미리 시작 → 'PDF파일 생성하기'를 누를 때 변환 대기 없음
// (기록·업로드·Pipedrive 첨부는 버튼을 눌러야만 진행됨)
(function() {
  try {
    const saved = JSON.parse(localStorage.getItem('estimateData') || 'null');
    const fid = new URLSearchParams(window.location.search).get('id') || (saved && saved.fileId);
    if (!fid) return;
    fetch(`${window.location.origin}/prepare-pdf`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fileId: fid })
    }).catch(function() {});
  } catch (e) {}
})();

// PDF 생성 함수 추가
async function generatePDF() {
  const button = document.getElementById('download-pdf');
  if (button.disabled) return; // 이미 처리 중이면 무시 (중복 클릭 방지)
  const originalText = button.textContent;
  let navigating = false;
  const progress = showProgress('PDF 견적서를 만들고 있어요', [
    'PDF 변환',
    '구글 드라이브 저장',
    'Pipedrive 거래에 첨부',
    '견적서 발행목록 기록'
  ]);

  try {
    button.disabled = true;
    button.textContent = '처리 중...';
    progress.step(0);

    console.log('=== PDF 생성 및 전체 프로세스 시작 ===');

    const estimateData = localStorage.getItem('estimateData');
    if (!estimateData) {
      alert('견적 데이터가 없습니다.');
      return;
    }
    const data = JSON.parse(estimateData);

    const urlParams = new URLSearchParams(window.location.search);
    console.log('preview.html - URL 파라미터:', urlParams.toString());
    console.log('preview.html - URL에서 가져온 id:', urlParams.get('id'));
    console.log('preview.html - localStorage data.fileId:', data.fileId);
    
    const fileId = urlParams.get('id') || data.fileId;
    console.log('preview.html - 최종 사용할 fileId:', fileId);
    
    if (fileId) {
      data.fileId = fileId;
      console.log('preview.html - data.fileId 설정 완료:', data.fileId);
    } else {
      console.error('preview.html - fileId가 없습니다!');
      alert("fileId가 없습니다. URL에 id 파라미터가 필요합니다.");
      return;
    }

    // 견적제품 선택 데이터 추가 (estimate_form.html에서 전달받은 데이터)
    const productCategory = localStorage.getItem('productCategory') || '';
    data.product_category = productCategory;
    
    console.log('전송할 데이터:', data);

    // 서버 요청 하나로 4단계가 모두 처리됨 → 예상 시간에 맞춰 표시, 마지막 단계는 응답을 기다림
    // (예상 시간은 Render 로그의 [TIMING] 기록을 보고 조정)
    progress.stepLater(1, 4000);
    progress.stepLater(2, 7000);
    progress.stepLater(3, 11000);

    const response = await fetch(`${window.location.origin}/collect-data`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    console.log('서버 응답 상태:', response.status, response.statusText);
    
    if (!response.ok) {
      const errorText = await response.text();
      console.error('서버 오류 응답:', errorText);
      throw new Error(`서버 오류: ${response.status} - ${errorText}`);
    }

    const result = await response.json();
    console.log('서버 응답:', result);

    if (result.status === 'success') {
      progress.complete();
      let holdMs = 300;
      if (result.already_issued) {
        progress.note('이미 발행된 견적이라 다시 만들지 않았습니다. 기존 PDF로 이동합니다.');
        holdMs = 2000;
      }
      navigating = true;

      setTimeout(() => {
        progress.leave();
        // PDF 링크가 있으면 PDF 공유화면으로 이동 (원본 fileId도 함께 전달)
        if (result.pdf_link) {
          const match = result.pdf_link.match(/\/d\/([\w-]+)/);
          const pdfId = match?.[1] || '';
          const originalFileId = data.fileId; // 원본 견적서 fileId
          window.location.href = `pdf-sharing.html?id=${pdfId}&fileId=${originalFileId}`;
        } else {
          // PDF 링크가 없어도 성공 메시지 표시 후 홈으로 이동
          alert('견적 데이터가 성공적으로 처리되었습니다!\n' + result.message);
          localStorage.removeItem('estimateData');
          localStorage.removeItem('productCategory');
          window.location.href = 'index.html';
        }
      }, holdMs);
    } else {
      progress.fail();
      alert('PDF를 만들지 못했습니다.\n\n' + (result.message || '알 수 없는 오류'));
    }
  } catch (e) {
    console.error('PDF 생성 중 오류:', e);
    progress.fail();
    const what = String(e && e.message || '').startsWith('서버 오류')
      ? 'PDF를 만드는 중 서버에서 오류가 났습니다.'
      : 'PDF를 만드는 중 서버와 연결이 끊겼습니다.';
    alert(what + '\n\n' +
      '이미 처리됐을 수 있으니, 다시 누르기 전에 발행목록이나 Pipedrive 거래를 먼저 확인해 주세요.\n' +
      '(처리가 끝난 견적은 다시 눌러도 두 번 기록되지 않습니다.)');
  } finally {
    // PDF 화면으로 넘어가는 중에는 버튼을 다시 열지 않음 (중복 발행 방지)
    if (!navigating) {
      progress.close();
      button.disabled = false;
      button.textContent = originalText;
    }
  }
}

// PDF 화면에서 뒤로가기로 돌아오면 버튼 다시 사용 가능하게
window.addEventListener('pageshow', function(e) {
  if (!e.persisted) return;
  const btn = document.getElementById('download-pdf');
  if (btn && btn.disabled) {
    btn.disabled = false;
    btn.textContent = 'PDF 파일 만들기';
  }
});

document.getElementById('back-to-edit').onclick = function() {
history.back();
};

// PDF 생성 버튼에 이벤트 리스너 추가
document.getElementById('download-pdf').onclick = generatePDF;
</script>
